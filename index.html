<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#000000" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="assets/icon-180.png" />
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
<title>Pocket Planetarium</title>
<meta name="description" content="A planetarium in your pocket — stars, galaxies, nebulae, exoplanets and black holes across the whole sky, powered by Aladin Lite and CDS/NASA data." />

<!-- Warm up the critical origins: the engine CDN and the HiPS tile server
     get full preconnects; everything queried later gets cheap DNS prefetch. -->
<link rel="preconnect" href="https://aladin.cds.unistra.fr" crossorigin />
<link rel="preconnect" href="https://alasky.cds.unistra.fr" crossorigin />
<link rel="dns-prefetch" href="https://axel.u-strasbg.fr" />
<link rel="dns-prefetch" href="https://simbad.cds.unistra.fr" />
<link rel="dns-prefetch" href="https://cds.unistra.fr" />
<link rel="dns-prefetch" href="https://tapvizier.cds.unistra.fr" />
<link rel="dns-prefetch" href="https://exoplanetarchive.ipac.caltech.edu" />
<link rel="dns-prefetch" href="https://commons.wikimedia.org" />
<link rel="dns-prefetch" href="https://upload.wikimedia.org" />

<link rel="stylesheet" href="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<a class="skip-link" href="#aladin-lite-div">Skip to sky view</a>

<!-- Full-bleed sky -->
<main id="sky-wrap"><div id="aladin-lite-div"></div></main>

<!-- Floating top controls -->
<header id="top-bar">
  <button id="brand-btn" class="glass-btn" aria-label="About Pocket Planetarium">
    <img src="assets/icon-192.png" alt="" class="brand-logo" width="24" height="24" />
    <span class="brand-name">Pocket&nbsp;Planetarium</span>
  </button>

  <form id="search-form" role="search" autocomplete="off">
    <svg class="icon search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><line x1="15.8" y1="15.8" x2="20" y2="20"/></svg>
    <label for="search-input" class="visually-hidden">Search an object or coordinates</label>
    <input id="search-input" type="search" placeholder="Search the sky" aria-label="Search an object or coordinates" enterkeyhint="search" role="combobox" aria-expanded="false" aria-autocomplete="list" />
    <ul id="search-history" class="dropdown-list" role="listbox" aria-label="Recent searches" hidden></ul>
    <ul id="search-suggestions" class="dropdown-list" role="listbox" aria-label="Suggestions" hidden></ul>
  </form>

  <div id="top-bar-right">
    <button id="view-toggle" class="glass-btn" aria-pressed="false" aria-label="Switch between globe view and inside-the-sky view" title="Globe / inside view">
      <svg class="icon icon-globe" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><ellipse cx="12" cy="12" rx="3.8" ry="8.5"/><line x1="3.5" y1="12" x2="20.5" y2="12"/></svg>
      <svg class="icon icon-dome" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17a8 8 0 0 1 16 0"/><circle cx="12" cy="19" r="1.6" fill="currentColor" stroke="none"/><line x1="12" y1="9" x2="12" y2="6.4"/><line x1="6.8" y1="11.2" x2="5" y2="9.4"/><line x1="17.2" y1="11.2" x2="19" y2="9.4"/></svg>
    </button>
    <button id="share-btn" class="glass-btn" aria-label="Share this view" title="Share this view">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><rect x="5" y="11" width="14" height="10" rx="3"/></svg>
    </button>
    <label for="tour-select" class="visually-hidden">Guided tours</label>
    <select id="tour-select" class="glass-select" aria-label="Guided tours">
      <option value="">Tours</option>
    </select>
    <button id="redlight-toggle" class="glass-btn" aria-pressed="false" aria-label="Toggle red-light night-vision mode" title="Red-light mode">
      <svg class="icon icon-red" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5" fill="currentColor" stroke="none"/></svg>
    </button>
    <button id="about-toggle" class="glass-btn" aria-label="About and credits" title="About &amp; credits">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><line x1="12" y1="11" x2="12" y2="16"/><line x1="12" y1="7.6" x2="12" y2="7.7"/></svg>
    </button>
  </div>
</header>

<!-- Layer dock: always-visible overlay along the left, one switch per celestial family -->
<nav id="layer-dock" class="glass-panel" aria-label="Celestial layers">
  <ul id="layer-dock-list" class="toggle-list"></ul>
</nav>

<!-- Object detail panel -->
<aside id="detail-panel" class="glass-panel" aria-label="Object details" hidden>
  <div class="sheet-grabber" aria-hidden="true"></div>
  <button id="detail-close" class="glass-btn small" aria-label="Close details">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><line x1="7" y1="7" x2="17" y2="17"/><line x1="17" y1="7" x2="7" y2="17"/></svg>
  </button>
  <div id="detail-content"></div>
</aside>

<!-- Spectrum rail: every survey on one vertical track, gamma-ray (top) to radio (bottom) -->
<div id="spectrum-rail" class="glass-panel" role="group" aria-label="Sky imagery across the electromagnetic spectrum">
  <button id="spectrum-collapse" aria-label="Collapse the spectrum control" aria-expanded="true">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5-5 5 5"/><path d="M7 19l5-5 5 5"/></svg>
  </button>
  <span class="spectrum-end" aria-hidden="true">γ-ray</span>
  <div id="spectrum-track" role="slider" tabindex="0" aria-orientation="vertical"
       aria-valuemin="0" aria-valuemax="600" aria-valuenow="300"
       aria-label="Blend between sky surveys, gamma-ray at the top to radio at the bottom">
    <div id="spectrum-gradient" aria-hidden="true"></div>
    <div id="spectrum-dots" aria-hidden="true"></div>
    <div id="spectrum-thumb" aria-hidden="true"></div>
  </div>
  <span class="spectrum-end" aria-hidden="true">Radio</span>
</div>
<div id="spectrum-chip" class="glass-panel" aria-hidden="true">
  <span id="spectrum-name">DSS2</span>
  <span id="spectrum-band">Optical — the classic all-sky view</span>
</div>

<!-- Sky Now: fly to the user's zenith -->
<button id="skynow-btn" class="glass-btn wide" aria-label="Show my sky right now">
  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5l18-8-8 18-2.2-7.8L3 11.5z"/></svg>
  <span class="skynow-label">Sky&nbsp;Now</span>
</button>

<!-- Zoom controls -->
<div id="zoom-stack">
  <button id="zoom-in" class="glass-btn" aria-label="Zoom in">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="6" x2="12" y2="18"/><line x1="6" y1="12" x2="18" y2="12"/></svg>
  </button>
  <button id="zoom-out" class="glass-btn" aria-label="Zoom out">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><line x1="6" y1="12" x2="18" y2="12"/></svg>
  </button>
</div>

<!-- Position readout -->
<div id="readouts" aria-live="off">
  <span id="coord-readout">—</span>
  <span class="dot-sep" aria-hidden="true"></span>
  <span id="fov-readout">—</span>
  <span class="dot-sep" aria-hidden="true"></span>
  <span id="clock-readout"></span>
</div>

<!-- First-run onboarding -->
<div id="onboarding" role="dialog" aria-label="Welcome to Pocket Planetarium" hidden>
  <div id="onboarding-card" class="glass-panel">
    <h2>Pocket Planetarium</h2>
    <div id="onboarding-steps"></div>
    <div id="onboarding-dots" aria-hidden="true"></div>
    <div class="onboarding-actions">
      <button id="onboarding-skip" class="btn-text">Skip</button>
      <span class="actions-spacer"></span>
      <button id="onboarding-prev" class="btn-secondary">Back</button>
      <button id="onboarding-next" class="btn-primary">Continue</button>
    </div>
  </div>
</div>

<!-- About & credits -->
<div id="about-modal" role="dialog" aria-label="About and credits" hidden>
  <div id="about-card" class="glass-panel">
    <button id="about-close" class="glass-btn small" aria-label="Close about dialog">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><line x1="7" y1="7" x2="17" y2="17"/><line x1="17" y1="7" x2="7" y2="17"/></svg>
    </button>
    <div id="about-content"></div>
  </div>
</div>

<!-- Toasts -->
<div id="toast-container" aria-live="polite" aria-atomic="true"></div>

<!-- defer: parse HTML without blocking; executes before the module below. -->
<script src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js" charset="utf-8" defer></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
