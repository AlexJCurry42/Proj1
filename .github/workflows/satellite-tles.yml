# Fetches fresh orbital element sets (TLEs) for the ISS + the brightest
# artificial satellites from CelesTrak, daily. TLE accuracy decays within
# days, so unlike the other data snapshots this one must stay fresh for
# on-device SGP4 propagation (js/satellites.js) to place satellites and
# predict ISS passes usefully.

name: Fetch satellite TLEs

on:
  push:
    paths:
      - '.github/workflows/satellite-tles.yml'
  schedule:
    - cron: '41 4 * * *' # daily, 04:41 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download from CelesTrak and merge
        run: |
          curl -fsS --retry 3 --retry-delay 20 \
            'https://celestrak.org/NORAD/elements/gp.php?GROUP=stations&FORMAT=tle' -o /tmp/stations.tle
          curl -fsS --retry 3 --retry-delay 20 \
            'https://celestrak.org/NORAD/elements/gp.php?GROUP=visual&FORMAT=tle' -o /tmp/visual.tle
          python3 - <<'EOF'
          import re

          def parse(path):
              sats = {}
              lines = [l.rstrip() for l in open(path) if l.strip()]
              for i in range(0, len(lines) - 2, 3):
                  name, l1, l2 = lines[i].strip(), lines[i+1], lines[i+2]
                  if not (l1.startswith('1 ') and l2.startswith('2 ')):
                      continue
                  norad = l1[2:7]
                  sats[norad] = (name, l1, l2)
              return sats

          sats = parse('/tmp/visual.tle')
          sats.update(parse('/tmp/stations.tle'))  # stations win on overlap (ISS freshest here)

          iss = [k for k, v in sats.items() if 'ISS' in v[0] and 'ZARYA' in v[0]]
          assert iss, 'ISS (ZARYA) missing from TLE sets'
          assert len(sats) >= 80, f'only {len(sats)} satellites'
          for name, l1, l2 in sats.values():
              assert re.match(r'^1 \d{5}', l1) and re.match(r'^2 \d{5}', l2), f'malformed TLE for {name}'

          with open('data/satellites_tle.txt', 'w') as f:
              for name, l1, l2 in sorted(sats.values(), key=lambda s: s[0]):
                  f.write(f'{name}\n{l1}\n{l2}\n')
          print(f'wrote {len(sats)} satellites (ISS present)')
          EOF

      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/satellites_tle.txt
          git diff --cached --quiet || git commit -m "Refresh satellite TLEs [skip ci]"
          # Data workflows can race each other on push day: rebase onto
          # whatever a sibling Action just committed before pushing.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
