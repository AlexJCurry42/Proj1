# Pocket Planetarium — scheduled health check. The app has no backend: it
# talks straight to CDS, VizieR, NASA, CelesTrak and Wikimedia Commons from
# the browser, and any of them can drift (TAP column renames, retired HiPS
# IDs, moved Commons files). This workflow replays every live service call
# daily and fails loudly when something breaks, alongside the pure-math unit
# suite. Both scripts are dependency-free Node — nothing to install.

name: Tests & live endpoint health

on:
  schedule:
    - cron: '52 5 * * *' # daily, 05:52 UTC
  workflow_dispatch:
  push:
    paths:
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/health-check.yml'

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (astro math, ephemeris, clock, SGP4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: node tests/unit.mjs

  live:
    name: Live endpoint health check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replay every live service call the app makes
        run: node tests/health-check.mjs
