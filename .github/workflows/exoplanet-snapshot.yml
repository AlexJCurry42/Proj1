# Refreshes data/exoplanets_snapshot.csv from the NASA Exoplanet Archive.
#
# Why this exists: the archive's TAP service does not send CORS headers, so a
# browser can never query it directly — the app instead ships this snapshot,
# fetched server-side where CORS doesn't apply. Runs when this workflow file
# first lands, on demand, and weekly to stay current (the confirmed-planet
# list grows by a handful per week).

name: Refresh exoplanet snapshot

on:
  push:
    paths:
      - '.github/workflows/exoplanet-snapshot.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch confirmed planets from the archive TAP (CSV)
        run: |
          mkdir -p data
          curl -fsS --retry 3 --retry-delay 10 --max-time 300 -G \
            'https://exoplanetarchive.ipac.caltech.edu/TAP/sync' \
            --data-urlencode 'query=select pl_name,hostname,ra,dec,discoverymethod,disc_year,sy_dist from pscomppars where ra is not null and dec is not null order by pl_name' \
            --data-urlencode 'format=csv' \
            -o data/exoplanets_snapshot.csv

      - name: Sanity-check the download before committing
        run: |
          head -1 data/exoplanets_snapshot.csv | grep -qi '^pl_name,'
          lines=$(wc -l < data/exoplanets_snapshot.csv)
          echo "rows: $lines"
          test "$lines" -gt 4000

      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/exoplanets_snapshot.csv
          git diff --cached --quiet || git commit -m "Refresh exoplanet snapshot ($(date -u +%F)) [skip ci]"
          git push
