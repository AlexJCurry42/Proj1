# Pocket Planetarium — browser regression suite: the real app against the
# real Aladin Lite engine in headless Chromium (tests/browser/run.mjs).
# Covers what the unit tests can't: boot budget, lazy layers, flights, the
# star bloom, the horizon lock, spectrum fades, time-lapse, location consent.

name: Browser tests

on:
  push:
    paths:
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - 'tests/browser/**'
      - '.github/workflows/browser-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an in-flight run of the same branch.
concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # pinned major: the suite is plain ESM + fetch
      - name: Install Playwright + Chromium (pinned — the version the suite is verified against)
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run browser regression suite
        run: node tests/browser/run.mjs
